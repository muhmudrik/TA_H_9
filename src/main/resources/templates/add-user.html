<!DOCTYPE html>
<html lang="en" xml:lang="http://thymeleaf.org" xmlns:th="http://www.springframework.org/schema/jdbc">
<head>
    <title>Add User</title>
    <object th:include="fragments/fragment :: css" th:remove="tag"></object>
    <object th:include="fragments/fragment :: js" th:remove="tag"></object>
</head>

<body>

<header th:replace="fragments/fragment :: navbar('Home')"></header>
<br><br>

<section id="hero" class="d-flex align-items-center">
    <div class="container">
        <div class="row">
            <div class="col-lg-5 pt-5 pt-lg-0 order-2 order-lg-1 d-flex flex-column justify-content-center">
                <div class="row">
                    <div class="col-md-10">
                        <h2 th:text=" 'Halo, ' + ${#httpServletRequest.remoteUser} + '!'" style="color: #FFC400"></h2>
                        <h1>Selamat Datang di Sistem Informasi Rekrutmen</h1>
                        <br>
                    </div>
                </div>
            </div>
            <div class="col-lg-7 order-1 order-lg-2">
                <div class="card">
                    <div class="card-header">Register</div>

                    <div class="card-body">
                        <p th:text="${pesan}"></p>
                        <form th:action="@{/user/add}" th:object="${pegawai}" method="POST">
                            <div >
                                <label class="col-sm-4">Username:</label>
                                <input type="text" class="col-sm-8 form-control input-sm" name="username" required>
                            </div>
                            <div >
                                <label class="col-sm-4">Nama:</label>
                                <input type="text" class="col-sm-8 form-control input-sm" name="nama" required>
                            </div>
                            <div >
                                <label class="col-sm-4">Nomor Telepon:</label>
                                <input type="text" class="col-sm-8 form-control input-sm" name="noTelepon" required>
                            </div>
                            <div >
                                <label class="col-sm-4">Tempat Lahir:</label>
                                <input type="text" class="col-sm-8 form-control input-sm" name="tempatLahir" required>
                            </div>
                            <div >
                                <label class="col-sm-4">Tanggal Lahir:</label>
                                <input type="datetime-local" class="col-sm-8 form-control input-sm" name="tanggalLahir" required>
                            </div>
                            <div >
                                <label class="col-sm-4">Alamat:</label>
                                <input type="text" class="col-sm-8 form-control input-sm" name="alamat" required>
                            </div>
                            <div >
                                <label class="col-sm-4">Password:</label>
                                <input type="password" class="col-sm-8 form-control input-sm" name="password" required>
                            </div>
                            <br>                            <br>
                            <select name="roleId" class="form-control">
                                <option selected value="">-- Pilih Role --</option>
                                <option th:each="role :${listRole}" th:value="${role.id}" th:text="${role.role}"></option>
                            </select>
                            <br>
                            <div class="row form-group justify-content-end">
                                <button type="submit" class="btn btn-dark">Simpan</button>
                            </div>
                        </form>
                        <div th:if="${hasMessage}">
                            <h5 th:text="${message}" class="text-danger"> </h5>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<br><br><br>
</body>

</html>
