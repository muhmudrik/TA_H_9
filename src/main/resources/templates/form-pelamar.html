<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Pelamar</title>
    <object th:include="fragments/fragment :: css" th:remove="tag"></object>
    <object th:include="fragments/fragment :: js" th:remove="tag"></object>
</head>
<body>
    <nav th:replace="fragments/fragment :: navbar('Home')"></nav>
    <br>
    <div class="container-fluid">
        <div class="row justify-content-center align-items-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header" style="color:white; font-weight: bold; background-color: darkorange">Tambah Pelamar Baru</div>
                    <div class="card-body">
                        <div class="alert alert-warning justify-content-center alert-dismissible fade show" role="alert" th:text="${msg}">
                            <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                <span aria-hidden="true">&times;</span>
                            </button>
                        </div>
                        <form th:action="@{/pelamar/buat}" method="POST">
                            <div class="row">
                                <div class="column" style="margin-left:15px; width:45%;">
                                    <label>Username<strong style="color:red;">*</strong></label>
                                    <input type="text" name="username" class="form-control"/>
                                </div>
                                <div class="column" style="margin-left:15px; width:45%;">
                                    <label>Password<strong style="color:red;">*</strong></label>
                                    <input type="password" name="password" class="form-control">
                                </div>
                            </div>
                            <br>

                            <div class="row">
                                <div class="column" style="margin-left:15px; margin-right:15px; width: 95%;">
                                    <label>Nama<strong style="color:red;">*</strong></label>
                                    <input type="text" name="nama" class="form-control">
                                </div>
                            </div>
                            <br>

                            <div class="row">
                                <div class="column" style="margin-left:15px; margin-right:15px; width: 95%;">
                                    <label>No. Telepon</label>
                                    <input type="text" name="no_telepon" class="form-control">
                                </div>
                            </div>
                            <br>


                            <div class="row">
                                <div class="column" style="margin-left:15px; width:55%;">
                                    <label>Tempat Lahir<strong style="color:red;">*</strong></label>
                                    <input type="text" name="tempat_lahir" class="form-control">
                                </div>
                                <div class="column" style="margin-left:15px;width:35%;">
                                    <label>Tanggal Lahir<strong style="color:red;">*</strong></label>
                                    <input type="date" name="tanggal_lahir" class="form-control" width="200%">
                                </div>
                            </div>
                            <br>

                            <div class="row">
                                <div class="column" style="margin-left:15px; margin-right:15px; width: 95%;">
                                    <label>Alamat</label>
                                    <input type="text" name="alamat" class="form-control">
                                </div>
                            </div>

                            <label style="font-size:10px;">bagian bertanda <strong style="color:red;">*</strong> wajib diisi dan tidak dapat dikosongkan</label>
                            <br>
                            <button type="submit" class="btn btn-primary">Simpan</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
<br><br>
</body>
</html>
