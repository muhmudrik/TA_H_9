<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Pelamar</title>
    <object th:include="fragments/fragment :: css" th:remove="tag"></object>
    <object th:include="fragments/fragment :: js" th:remove="tag"></object>
</head>

    <body>
        <nav th:replace="fragments/fragment :: navbar('Sukses Tambah Pelamar')"></nav>
        <br>
        <div class="container-fluid">
            <br>
            <div class="card" style="width:50%; left: 25%; background-color: darkorange">
                <div class="card-body">
                    <h2 th:text="'Pelamar dengan nama ' + ${pelamar.nama} + 'dengan ID ' + ${pelamar.id} + ' berhasil ditambahkan'" style="font-weight:bold; color: white"></h2>
                    <h5>Anda dapat mengubah data pelamar Anda kembali <a th:href="@{/pelamar/ubah/} + ${pelamar.id}" style="color:black;">di sini</a>.</h5>
                    <a th:href="@{/}" style="font-style: italic; color: white">Kembali</a>
                </div>
            </div>
        </div>

    </body>
</html>
