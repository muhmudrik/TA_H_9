<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Home</title>
    <object th:include="fragments/fragment :: css" th:remove="tag"></object>
    <object th:include="fragments/fragment :: js" th:remove="tag"></object>
    <style>
        body {
            font-family: Arial;
            color: white;
        }

        .split {
            height: 100%;
            width: 50%;
            position: fixed;
            z-index: 1;
            top: 0;
            overflow-x: hidden;
            padding-top: 20px;
        }

        .left {
            left: 0;
            background-color: #FFC200 ;
        }

        .right {
            right: 0;
            background-color: red;
        }

        .centered {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        .centered img {
            width: 150px;
            border-radius: 50%;
        }
    </style>
</head>
<body>
<!--    <header th:replace="fragments/fragment :: navbar('Home')"></header>-->
    <br><br><br>
    <section id="hero" class="d-flex align-items-center">
        <div class="container">
            <br><br>
            <br><br>
            <br><br>
            <br><br>
            <div class="row">
                <div class="col-lg-6 pt-5 pt-lg-0 order-2 order-lg-1 d-flex flex-column justify-content-center">
                    <div class="row"></div>
                </div>
                <div class="col-lg-6 order-1 order-lg-2">
                    <div class="card">
                        <div style="color: black" class="card-header">Register</div>
                        <div class="card-body">
    <!--

         <p th:text="${pesan}"></p>-->
                            <form th:action="@{/login}" method="POST">

                                <div th:if="${param.error}">
                                    <span style="color: red">Invalid username or password</span>
                                </div>

                                <div class="row form-group">
                                    <label style="color: black" class="col-sm-4">Username:</label>
                                    <input type="text" class="col-sm-8 form-control input-sm" name="username">
                                </div>

                                <div class="row form-group">
                                    <label style="color: black" class="col-sm-4">Password:</label>
                                    <input type="password" class="col-sm-8 form-control input-sm" name="password">
                                </div>

                                <div class="row form-group">
                                    <br>
                                    <button style="margin-left: 16px;" type="submit" class="btn btn btn-outline-dark">Sign In</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                <div class="col-lg-7 order-1 order-lg-2 hero-img">
                    <img src="https://i.ibb.co/sPXzbQW/greeting.png" style="margin-top:-62%;margin-left: -15%;" class="img-fluid animated"  alt="greeting" border="0">
                </div>
            </div>
        </div>
    </section>
</body>
</html>
