<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Pelamar</title>
    <object th:include="fragments/fragment :: css" th:remove="tag"></object>
    <object th:include="fragments/fragment :: js" th:remove="tag"></object>
</head>


<body>
<nav th:replace="fragments/fragment :: navbar('Home')"></nav>
<div class="container-fluid">
    <div class="row justify-content-center align-items-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header" style="color:white; font-weight: bold; background-color: darkorange">List Gaji</div>
                <div class="card-body">
                    <table class="table">
                        <thead>
                        <tr>
                            <th>Username</th>
                            <th>Gaji</th>
                            <th>Lama Bekerja</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="g, iterationStatus : ${gaji}">
                            <td th:text="${g.username}"></td>
                            <td th:text="${g.gajiPokok}"></td>
                            <td th:text="${g.lamaBerkerja}"></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
