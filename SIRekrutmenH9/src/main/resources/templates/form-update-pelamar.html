<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tambah Pelamar</title>
    <object th:include="fragments/fragment :: css" th:remove="tag"></object>
    <object th:include="fragments/fragment :: js" th:remove="tag"></object>
</head>


<body>
<nav th:replace="fragments/fragment :: navbar('Home')"></nav>
<div class="container-fluid">
    <div class="row justify-content-center align-items-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">Tambah Pelamar Baru</div>
                <div class="card-body">

                    <div class="alert alert-warning justify-content-center alert-dismissible fade show" role="alert" th:text="${msg}">
                        <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>

                    <form th:action="@{/pelamar/ubah}" method="POST">
                        <label>Nama</label>
                        <input type="text" name="nama" class="form-control">
                        <br>
                        <label>No. Telepon</label>
                        <input type="text" name="no_telepon" class="form-control">
                        <br>
                        <label>Tempat Lahir</label>
                        <input type="text" name="tempat_lahir" class="form-control">
                        <br>
                        <label>Tanggal Lahir</label>
                        <input type="date" name="tanggal_lahir" class="form-control">
                        <br>
                        <label>Alamat</label>
                        <input type="text" name="alamat" class="form-control">
                        <br>
                        <button type="submit" class="btn btn-primary">Simpan</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
